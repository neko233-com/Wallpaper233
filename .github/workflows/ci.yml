name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Wallpaper233.slnx -r win-x64

      - name: Build
        run: dotnet build Wallpaper233.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wallpaper233.slnx -c Release --no-build --no-restore
