name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Wallpaper233.slnx -r win-x64

      - name: Publish Windows x64
        run: dotnet publish src/Wallpaper233.App/Wallpaper233.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:PublishAot=false -p:PublishTrimmed=false -p:SelfContained=true -p:PublishDir=bin/Release/win-x64-release/ --no-restore

      - name: Package
        shell: pwsh
        run: |
          $publishPath = "src/Wallpaper233.App/bin/Release/win-x64-release"
          $archivePath = "Wallpaper233-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path "$publishPath/*" -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "Wallpaper233-${{ github.ref_name }}-win-x64.zip" --title "Wallpaper233 ${{ github.ref_name }}" --generate-notes --prerelease
